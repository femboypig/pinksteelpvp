<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="PinkSteelPvP — Semi-anarchy PvP server">
  <title>PinkSteelPvP</title>
  <link rel="icon" type="image/png" href="assets/pinksteelpvp-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <img class="logo" src="assets/pinksteelpvp-logo.png" alt="Логотип PinkSteelPvP">

    <h1>PinkSteelPvP</h1>
    <p class="description">Semi-anarchy PvP server</p>

    <div class="addresses">
      <button class="address copy-ip" type="button" data-ip="pinksteelpvp.ru">
        pinksteelpvp.ru
      </button>
      <button class="address address-secondary copy-ip" type="button" data-ip="msc.pinksteelpvp.ru">
        msc.pinksteelpvp.ru <span>— Moscow node</span>
      </button>
      <p class="copy-status" aria-live="polite">click address to copy</p>
    </div>

    <nav aria-label="Социальные сети">
      <a href="https://dsc.gg/pinksteelpvp" target="_blank" rel="noopener noreferrer">Discord</a>
      <a href="https://t.me/pinksteelpvp" target="_blank" rel="noopener noreferrer">Telegram</a>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
